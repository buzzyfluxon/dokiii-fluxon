appId: com.dokiii.app
productName: DOKIII
copyright: Copyright (c) 2026 fluxonbuzz
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: build
    to: build
afterPack: scripts/after-pack.js
publish:
  provider: github
  owner: buzzyfluxon
  repo: dokiii-fluxon
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DOKIII
  artifactName: DOKIII-Setup.exe
  uninstallDisplayName: DOKIII
  differentialPackage: true
  # Hard-kills a running DOKIII and removes autostart entries on uninstall.
  include: scripts/installer.nsh
  # Removes %APPDATA%\dokiii (saved widgets/settings) on uninstall. The stock
  # uninstaller skips this automatically during updates.
  deleteAppDataOnUninstall: true
