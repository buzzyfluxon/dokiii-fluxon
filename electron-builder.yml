appId: com.dokiii.app
productName: DOKIII
copyright: Copyright (c) 2026 fluxonbuzz
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: build
    to: build
afterPack: scripts/after-pack.js
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DOKIII
  artifactName: DOKIII-Setup.exe
  uninstallDisplayName: DOKIII
